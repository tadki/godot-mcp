name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:coverage
        working-directory: server
      # Wire-level contract of the built artifact over real stdio JSON-RPC:
      # initialize metadata, flat schemas, humanized errors, read-only mode.
      - run: npm run test:protocol
        working-directory: server

  # SEE-1334 Phase 1 (SPEC-012): repo-wide ESLint gate — flat config dual
  # rulesets (server/src TS + launch/*.mjs JS) with the gqt-mapped complexity
  # gates (`complexity` warn@10, `sonarjs/cognitive-complexity` error@15).
  # Errors are zero-tolerance; the legacy warning count is pinned by
  # --max-warnings in the root lint script and may only ratchet down.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
