name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:coverage
        working-directory: server
      # Wire-level contract of the built artifact over real stdio JSON-RPC:
      # initialize metadata, flat schemas, humanized errors, read-only mode.
      - run: npm run test:protocol
        working-directory: server

  # SEE-1334 Phase 1 (SPEC-012): repo-wide ESLint gate — flat config dual
  # rulesets (server/src TS + launch/*.mjs JS) with the gqt-mapped complexity
  # gates (`complexity` warn@10, `sonarjs/cognitive-complexity` error@15).
  # Errors are zero-tolerance; the legacy warning count is pinned by
  # --max-warnings in the root lint script and may only ratchet down.
  # SEE-1344 ⑬: the baseline includes 8 legacy fixed-sleep sites flagged by
  # the no-restricted-syntax setTimeout warning (warning tier, not a ban —
  # legitimate timeout paths keep an inline disable with a WHY).
  # SEE-1363 §SPEC-005: `npm run lint` also runs lint:bash — the bash-domain
  # fixed-sleep grep-gate (launch/*.sh + launch/tests/**/*.sh; bounded-poll
  # loops and inline-annotated under-test sleeps exempt) with an only-down
  # ratchet baseline in launch/tests/lint/bash-sleep-baseline.txt.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  # SEE-1334 SPEC-063: mutation gate as the 6th blocking job. Whitelist
  # mutation only (stryker.config.json), break=100 (SPEC-061 100% target — exemptions ledgered in docs/mutation-exemptions.md).
  # Measured ~50s locally / well under the 15m budget; escalation path if CI
  # drifts over budget: whitelist matrix → tighter concurrency → incremental.
  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run mutation
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-gate-report
          path: |
            reports/mutation/mutation.json
            .stryker-tmp/**/*.log
          retention-days: 7

  # SEE-1492 §SPEC-006: static syntax gate for every inline `run:` script in
  # the workflow YAML. The SEE-1492 drift-watch break (an in-continuation
  # comment swallowing a `\`) was invisible to every existing gate — it is not
  # a .sh file, so bash -n batches and lint:bash never saw it — and sat red
  # for a month. This job runs bash -n over all extracted run blocks (all
  # workflow files, incl. launch-special.yml's drift-watch) so the class
  # cannot land again.
  workflow-run-syntax-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PyYAML (gate dependency, fail-closed without it)
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Check all workflow inline run scripts (bash -n)
        run: bash .github/scripts/check-workflow-run-syntax.sh
